name: Build Dicio with Arabic support

# Runs automatically on every push, or manually from the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Apply Arabic patches
        run: |
          set -e

          # 1) Register LANGUAGE_AR = 16 in the protobuf enum
          if ! grep -q "LANGUAGE_AR" app/src/main/proto/language.proto; then
            sed -i 's/^  LANGUAGE_CS = 1;/  LANGUAGE_AR = 16; \/\/ Arabic\n  LANGUAGE_CS = 1;/' \
              app/src/main/proto/language.proto
          fi

          # 2) Add "العربية" to the language picker
          if ! grep -q "LANGUAGE_AR" app/src/main/kotlin/org/stypox/dicio/settings/Definitions.kt; then
            sed -i 's|^\(\s*\)ListSetting.Value(Language.LANGUAGE_CS, "Čeština"),|\1ListSetting.Value(Language.LANGUAGE_AR, "العربية"),\n\1ListSetting.Value(Language.LANGUAGE_CS, "Čeština"),|' \
              app/src/main/kotlin/org/stypox/dicio/settings/Definitions.kt
          fi

          # 3) Copy Arabic sentence files (this step assumes they are already in the repo)
          mkdir -p app/src/main/sentences/ar
          echo "Arabic sentences already committed"

          # 4) Fill gaps in the French sentence files
          echo "French sentences already committed"

          echo "--- verification ---"
          grep -n "LANGUAGE_AR" app/src/main/proto/language.proto
          grep -n "العربية" app/src/main/kotlin/org/stypox/dicio/settings/Definitions.kt
          ls -1 app/src/main/sentences/ar/ | wc -l

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/Dicio-4.2-Arabic-unsigned.apk
          ls -la out/

      # ---------- Optional signing ----------
      # If you add the four secrets (see README), this produces a signed,
      # installable APK. Without secrets it is skipped and you still get the
      # unsigned APK + a ready-to-sign debug APK below.
      - name: Decode keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Sign APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          "$APKSIGNER" sign \
            --ks ./keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            out/Dicio-4.2-Arabic-unsigned.apk
          mv out/Dicio-4.2-Arabic-unsigned.apk out/Dicio-4.2-Arabic.apk
          "$APKSIGNER" verify --print-certs out/Dicio-4.2-Arabic.apk

      # ---------- Always available: debug APK ----------
      # Debug APKs are signed with the standard Android debug key and install
      # on any phone without needing you to create a keystore.
      - name: Build debug APK (installable without keystore)
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect debug APK
        run: cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dicio-arabic-apk
          path: out/*.apk
          retention-days: 30